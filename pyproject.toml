[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-graphrag"
version = "0.1.0"
description = "Legal Office-source extraction, Markdown preparation, and validation."
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.25",
  "lxml>=5.3",
  "olefile>=0.47",
  "openpyxl>=3.1",
  "pydantic-settings>=2.5",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Windows bind mounts report Python files as executable although they are not scripts.
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
